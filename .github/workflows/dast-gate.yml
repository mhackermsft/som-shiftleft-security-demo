name: dast-gate

# Shift-left security gate.
#
# Build, test, DEPLOY TO AZURE APP SERVICE, then point a dynamic scanner at the
# deployed site and fail the build if the browser defences promised in the
# threat model are missing.
#
# WHY IT DEPLOYS FIRST
#
# An earlier version started the app on localhost inside the runner and scanned
# that. It worked, but it made a weaker claim: "we scanned something that
# resembles what we ship". Deploying to Azure App Service first means the scan
# attacks the real, running, HTTPS workload in the same state a citizen would
# reach it. That is the honest version of dynamic testing, and it is the
# difference between a CI trick and a security gate.
on:
  push:
    branches: [main, feature/reflected-input]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC. GitHub mints a short-lived token that Entra ID trusts;
  # nothing long-lived is stored in the repository at all.
  id-token: write

env:
  # TWO WEB APPS, NOT ONE, AND THIS MATTERS.
  #
  # Both branches deploy on every push. When they shared a single App Service
  # they raced: main deployed the safe build seconds before the vulnerable
  # branch's scan ran, so the scan attacked the SAFE app, passed, and the demo
  # silently lost its whole point - a "vulnerable" branch with a green tick.
  #
  # So the proposed change gets its own deployment target. That is also how you
  # would really do this: you do not test a risky change by pushing it over the
  # thing that is currently serving people.
  AZURE_WEBAPP_NAME_MAIN: somshiftleft5ae79d
  AZURE_WEBAPP_NAME_PR: somshiftleft5ae79d-pr

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Choose the deployment target for this branch
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            NAME="${{ env.AZURE_WEBAPP_NAME_MAIN }}"
          else
            NAME="${{ env.AZURE_WEBAPP_NAME_PR }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "url=https://$NAME.azurewebsites.net" >> "$GITHUB_OUTPUT"
          echo "deploying to $NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Run unit tests
        run: npm test

      # ---- deploy to Azure -------------------------------------------------
      #
      # PASSWORDLESS, AND THAT IS THE POINT.
      #
      # The obvious way to deploy from GitHub is to paste an App Service publish
      # profile into a secret. It is also a long-lived credential sitting in a
      # repository, which is exactly the habit a security session should not be
      # teaching. Basic authentication is disabled on this App Service by
      # default, so the publish profile does not even work.
      #
      # Instead GitHub asks Entra ID for a short-lived token, and Entra trusts
      # this specific repository and branch through a federated credential. No
      # password, no key, nothing to rotate, nothing to leak. The identity is
      # scoped to Website Contributor on ONE resource group.
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.target.outputs.name }}

      - name: Wait for the deployed app to answer
        run: |
          URL="${{ steps.target.outputs.url }}"
          echo "waiting for $URL/health"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 "$URL/health"; then
              echo ""
              echo "app is up after $((i*5))s"
              break
            fi
            sleep 5
          done
          # WARM IT PROPERLY BEFORE THE SCAN.
          #
          # The demo runs on the free App Service tier, which puts the worker to
          # sleep when idle. /health answering once only proves the container
          # started; the first request to the actual page can still take long
          # enough that ZAP's spider gives up with "Read timed out" and the whole
          # job fails with exit code 3 - a red build that says nothing about
          # security and undermines the entire point of the demo.
          #
          # So hit the real page, the one the scanner is about to attack, until
          # it responds promptly twice in a row.
          echo "warming the page the scanner will attack"
          for i in $(seq 1 12); do
            start=$(date +%s%N)
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL/?name=warmup" || echo 000)
            ms=$(( ($(date +%s%N) - start) / 1000000 ))
            echo "  attempt $i: HTTP $code in ${ms}ms"
            if [ "$code" = "200" ] && [ "$ms" -lt 2000 ]; then
              hits=$((hits+1))
              [ "${hits:-0}" -ge 2 ] && { echo "warm"; exit 0; }
            else
              hits=0
            fi
            sleep 3
          done
          echo "app never became responsive enough to scan"
          exit 1

      # ---- attack it -------------------------------------------------------
      - name: Run OWASP ZAP baseline scan against Azure
        run: |
          chmod 777 "$PWD"
          docker pull ghcr.io/zaproxy/zaproxy:stable
          # -T 5 gives the spider a five minute budget and -z raises the per
          # request timeout, because a free-tier App Service can still stall on
          # an individual request even after the warm-up above. Without these a
          # slow response fails the JOB rather than reporting a FINDING, which
          # is a red build that has nothing to do with security.
          docker run --rm -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "${{ steps.target.outputs.url }}/?name=%3Cscript%3Ealert(1)%3C/script%3E" \
            -J zap-report.json -r zap-report.html -I -T 5 \
            -z "-config connection.timeoutInSecs=60"

      - name: Fail on security gate findings
        run: |
          node <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('zap-report.json', 'utf8'));
          const alerts = (report.site || []).flatMap(s => s.alerts || []);
          // These map directly to the two threats selected in the STRIDE model:
          // tampering (reflected input) and information disclosure (missing
          // browser defences). Gating on a curated list rather than on "any
          // finding" is deliberate - a gate that fires on everything gets
          // switched off within a week.
          const gate = [
            'Missing Anti-clickjacking Header',
            'X-Content-Type-Options Header Missing',
            'Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s)',
            'Content Security Policy (CSP) Header Not Set',
            'Permissions Policy Header Not Set'
          ];
          const gateAlerts = alerts.filter(a => gate.includes(a.alert));
          console.log(`ZAP alerts: ${alerts.length}, gate findings: ${gateAlerts.length}`);
          for (const a of gateAlerts) console.log(`${a.riskdesc}: ${a.alert}`);
          if (gateAlerts.length) process.exit(1);
          JS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            zap-report.json
            zap-report.html


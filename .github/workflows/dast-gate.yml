name: dast-gate
on:
  push:
    branches: [main, feature/reflected-input]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - name: Run unit tests
        run: npm test
      - name: Start app
        run: |
          npm start > app.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 2; done
          cat app.log
          exit 1
      - name: Run OWASP ZAP baseline scan
        run: |
          chmod 777 "$PWD"
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "http://127.0.0.1:3000/?name=%3Cscript%3Ealert(1)%3C/script%3E" -J zap-report.json -r zap-report.html -I
      - name: Fail on security gate findings
        run: |
          node <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('zap-report.json', 'utf8'));
          const alerts = (report.site || []).flatMap(s => s.alerts || []);
          const gateAlerts = alerts.filter(a => ['Missing Anti-clickjacking Header','X-Content-Type-Options Header Missing','Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s)','Content Security Policy (CSP) Header Not Set','Permissions Policy Header Not Set'].includes(a.alert));
          console.log(`ZAP alerts: ${alerts.length}, gate findings: ${gateAlerts.length}`);
          for (const a of gateAlerts) console.log(`${a.riskdesc}: ${a.alert}`);
          if (gateAlerts.length) process.exit(1);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            zap-report.json
            zap-report.html
            app.log
